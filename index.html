<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nerd Card Verification</title>
<style>
  :root{
    --bg:#05070d; --green:#39ff88; --cyan:#22e4ff; --pink:#ff3df2; --yellow:#ffe14d;
    --text:#d9ffe9; --dim:#6a8f7d;
    --mono: "SF Mono","Cascadia Code","Fira Code",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
  #rain,#confetti{position:fixed;inset:0;width:100%;height:100%}
  #rain{opacity:.35}
  #confetti{pointer-events:none;z-index:50}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:41;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.85) 100%)}

  .stage{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
  .term{font-size:13px;color:var(--green);letter-spacing:.15em;margin-bottom:22px;min-height:1.2em}
  .term::after{content:"▋";animation:blink 1s steps(1) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}

  h1{font-size:clamp(30px,8vw,72px);line-height:1.05;font-weight:800;letter-spacing:-.02em;position:relative;
    color:#fff;text-shadow:0 0 18px rgba(57,255,136,.6);max-width:900px}
  h1 .g{position:relative;display:inline-block}
  h1 .g::before,h1 .g::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
  h1 .g::before{color:var(--pink);transform:translate(-2px,0);clip-path:inset(0 0 60% 0);animation:gl1 2.6s infinite}
  h1 .g::after{color:var(--cyan);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl2 3.1s infinite}
  @keyframes gl1{0%,88%,100%{transform:translate(0)}90%{transform:translate(-5px,-2px)}94%{transform:translate(4px,1px)}}
  @keyframes gl2{0%,85%,100%{transform:translate(0)}87%{transform:translate(5px,2px)}92%{transform:translate(-4px,-1px)}}
  .sub{margin-top:14px;color:var(--dim);font-size:14px}

  .btns{margin-top:46px;display:flex;gap:28px;align-items:center;justify-content:center;min-height:120px}
  button{font-family:var(--mono);font-weight:800;cursor:pointer;border:0;border-radius:12px;letter-spacing:.08em}
  #yes{--s:1;font-size:20px;padding:16px 38px;color:#03140a;
    background:linear-gradient(135deg,var(--green),var(--cyan));
    box-shadow:0 0 24px rgba(57,255,136,.55),0 0 60px rgba(34,228,255,.25),inset 0 -4px 0 rgba(0,0,0,.2);
    transform:scale(var(--s));transition:transform .35s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:20}
  #yes:hover{filter:brightness(1.15)}
  #yes.pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 40px rgba(57,255,136,.9),0 0 120px rgba(34,228,255,.5),inset 0 -4px 0 rgba(0,0,0,.2)}}
  #no{font-size:18px;padding:14px 30px;color:var(--pink);background:rgba(255,61,242,.06);
    border:2px solid var(--pink);box-shadow:0 0 18px rgba(255,61,242,.35);z-index:30;
    transition:left .22s ease, top .22s ease}
  #no.free{position:fixed}
  .taunt{margin-top:26px;height:1.3em;color:var(--yellow);font-size:15px;text-shadow:0 0 10px rgba(255,225,77,.5)}

  /* ---------- CARD ---------- */
  .reveal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:safe center;flex-direction:column;padding:16px;perspective:1200px;overflow-y:auto}
  .reveal > *{flex-shrink:0}
  .reveal.on{display:flex}
  .access{color:var(--green);font-size:clamp(14px,3.5vw,18px);letter-spacing:.3em;margin-bottom:18px;text-shadow:0 0 10px var(--green);animation:fadeIn .6s both}
  .card{width:min(360px,92vw);border-radius:20px;padding:20px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#0d1424,#0a0f1c 60%,#140a1f);
    border:2px solid transparent;
    background-clip:padding-box;
    box-shadow:0 0 0 2px rgba(57,255,136,.6),0 0 40px rgba(57,255,136,.35),0 0 120px rgba(255,61,242,.2);
    transform-style:preserve-3d;transition:transform .12s ease-out;
    animation:flipIn 1s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes flipIn{from{transform:rotateY(180deg) scale(.3);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}}
  .holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.35;
    background:linear-gradient(115deg,transparent 20%,rgba(255,61,242,.7) 35%,rgba(34,228,255,.7) 45%,rgba(57,255,136,.7) 55%,rgba(255,225,77,.6) 65%,transparent 80%);
    background-size:250% 250%;background-position:var(--hx,50%) var(--hy,50%)}
  .top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .rarity{color:var(--yellow);text-shadow:0 0 8px rgba(255,225,77,.6)}
  .portrait{margin:12px 0 10px;height:124px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(57,255,136,.25),transparent 60%),
      repeating-linear-gradient(90deg,rgba(57,255,136,.08) 0 1px,transparent 1px 18px),
      repeating-linear-gradient(0deg,rgba(57,255,136,.08) 0 1px,transparent 1px 18px),#070b14;
    border:1px solid rgba(57,255,136,.3)}
  .avatar{position:relative;width:104px;height:104px;overflow:hidden;border-radius:50%;animation:bob 3s ease-in-out infinite;
    box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--green),0 0 22px rgba(57,255,136,.7),0 0 50px rgba(255,61,242,.35)}
  .avatar .toon{width:100%;height:100%;border-radius:50%;display:block}
  .avatar::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(57,255,136,.04) 0 1px,transparent 1px 3px)}
  .specs{position:absolute;inset:0;width:100%;height:100%;z-index:2;opacity:0;transform:translateY(-70px) rotate(-25deg);
    animation:specsDrop .7s cubic-bezier(.34,1.56,.64,1) 1.1s forwards}
  @keyframes specsDrop{to{opacity:1;transform:none}}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .name{font-size:26px;font-weight:800;color:#fff;letter-spacing:.06em}
  .cls{font-size:12px;color:var(--cyan);margin-top:2px;letter-spacing:.1em}
  .stats{margin-top:12px;display:grid;gap:7px}
  .stat .l span:first-child{min-width:0;overflow-wrap:break-word;padding-right:8px}
  .stat{font-size:clamp(10px,2.8vw,11px)}
  .stat .l{display:flex;justify-content:space-between;margin-bottom:3px;color:var(--text)}
  .bar{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--cyan));
    box-shadow:0 0 8px var(--green);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
  .bar.grass i{background:linear-gradient(90deg,#ff7a1a,#ffb347);box-shadow:0 0 8px #ff8c1a}
  .bar.low i{background:linear-gradient(90deg,var(--pink),#ff7a7a);box-shadow:0 0 8px var(--pink)}
  .ability{margin-top:12px;padding:10px;border-radius:10px;font-size:11px;line-height:1.5;overflow-wrap:break-word;
    background:rgba(255,61,242,.08);border:1px dashed rgba(255,61,242,.5)}
  .ability b{color:var(--pink);letter-spacing:.12em}
  .foot{margin-top:12px;display:flex;justify-content:space-between;font-size:9px;color:var(--dim);letter-spacing:.15em}
  .after{margin-top:20px;font-size:13px;color:var(--dim);text-align:center;animation:fadeIn .6s 1.2s both}
  .after b{color:var(--yellow)}
  .again{margin-top:14px;font-size:12px;padding:10px 18px;background:transparent;color:var(--green);border:1px solid var(--green);animation:fadeIn .6s 1.4s both}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="confetti"></canvas>
<div class="scan"></div><div class="vignette"></div>

<section class="stage" id="stage">
  <div class="term" id="term"></div>
  <h1><span class="g" data-t="Ready to see my">Ready to see my</span><br><span class="g" data-t="nerd card?">nerd card?</span></h1>
  <p class="sub">// there is only one correct answer.</p>
  <div class="btns">
    <button id="yes">YES</button>
    <button id="no">NO</button>
  </div>
  <div class="taunt" id="taunt"></div>
</section>

<section class="reveal" id="reveal">
  <div class="access">▸ ACCESS GRANTED ◂</div>
  <div class="card" id="card">
    <div class="holo"></div>
    <div class="top"><span>NERD CARD // v9.0.1</span><span class="rarity">★ LEGENDARY</span></div>
    <div class="portrait">
      <div class="avatar">
        <svg class="toon" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="bgG" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#1b3a2c"/><stop offset="1" stop-color="#070b14"/></radialGradient>
            <radialGradient id="skinG" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#f7d2b8"/><stop offset="1" stop-color="#e3a98c"/></radialGradient>
            <radialGradient id="irisG" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#b6d36a"/><stop offset="1" stop-color="#5f7f2a"/></radialGradient>
          </defs>
          <rect width="100" height="100" fill="url(#bgG)"/>
          <g transform="translate(50 52) scale(1.18) translate(-50 -52)">
          <!-- neck + shirt -->
          <path d="M42 68h16v16H42z" fill="#d99c80"/>
          <path d="M10 100C12 87 26 81 40 79L50 92L60 79C74 81 88 87 90 100Z" fill="#111"/>
          <path d="M43 79L50 90L57 79Z" fill="#e6ad91"/>
          <path d="M40 78L45 93L50 87Z M60 78L55 93L50 87Z" fill="#1d1d1d" stroke="#3a3a3a" stroke-width=".8" stroke-linejoin="round"/>
          <circle cx="50" cy="95" r="1" fill="#333"/>
          <!-- ears -->
          <ellipse cx="24.5" cy="49" rx="4" ry="6.5" fill="#e9b195"/>
          <ellipse cx="75.5" cy="49" rx="4" ry="6.5" fill="#e9b195"/>
          
          <!-- head (big caricature dome, small chin) -->
          <path d="M50 14C70 14 77.5 28 77.5 45C77.5 63 66 74.5 50 74.5C34 74.5 22.5 63 22.5 45C22.5 28 30 14 50 14Z" fill="url(#skinG)"/>
          <!-- hair: sleek, swept to the side, tucked behind ears -->
          <path d="M23 50C19 26 33 9 52 9C71 9 82 24 77.5 50C76 40 74 33 70 28C62 25 44 22 30 27C27 33 24.5 41 23 50Z" fill="#2a1c15"/>
          <path d="M30 27C40 17 60 15 70 28C64 22 50 20 30 27Z" fill="#3d2a20"/>
          <path d="M27 34C36 24 56 20 71 29C60 25 44 26 27 34Z" fill="#3a271d"/>
          <path d="M70 28C75 34 77 42 77.5 50L79.5 48C80 40 77 31 70 28Z" fill="#2a1c15"/>
          <g fill="none" stroke="#2a1c15" stroke-width=".7" stroke-linecap="round">
            <path d="M44 10C42 5 45 2 47 1"/><path d="M52 9C54 4 58 3 60 4"/><path d="M38 12C34 8 33 5 34 3"/><path d="M60 10C64 6 68 7 69 8"/>
          </g>
          <!-- earlobes + earrings (both sides) -->
          <g>
            <ellipse cx="75.5" cy="52.5" rx="3.3" ry="4" fill="#e9b195"/>
            <circle cx="77.2" cy="46.5" r=".85" fill="#d4d7dc"/>
            <g fill="none" stroke="#d4d7dc" stroke-width=".8">
              <circle cx="78.3" cy="53.6" r="1.5"/><circle cx="77.6" cy="55.9" r="1.5"/><circle cx="76.3" cy="57.6" r="1.5"/>
            </g>
            <ellipse cx="24.5" cy="52.5" rx="3.3" ry="4" fill="#e9b195"/>
            <circle cx="22.8" cy="46.5" r=".85" fill="#d4d7dc"/>
            <g fill="none" stroke="#d4d7dc" stroke-width=".8">
              <circle cx="21.7" cy="53.6" r="1.5"/><circle cx="22.4" cy="55.9" r="1.5"/><circle cx="23.7" cy="57.6" r="1.5"/>
            </g>
          </g>
          <!-- brows: soft and arched -->
          <path d="M31 37.5Q37 34 43 36.5" stroke="#2a1c15" stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <path d="M57 36.5Q63 34 69 37.5" stroke="#2a1c15" stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <!-- big round sparkly eyes -->
          <ellipse cx="37" cy="48" rx="5.8" ry="6.2" fill="#fff"/>
          <ellipse cx="63" cy="48" rx="5.8" ry="6.2" fill="#fff"/>
          <circle cx="37.3" cy="48.6" r="4.6" fill="url(#irisG)"/><circle cx="63.3" cy="48.6" r="4.6" fill="url(#irisG)"/>
          <circle cx="37.3" cy="48.8" r="2.5" fill="#15150e"/><circle cx="63.3" cy="48.8" r="2.5" fill="#15150e"/>
          <circle cx="39" cy="46.6" r="1.6" fill="#fff"/><circle cx="65" cy="46.6" r="1.6" fill="#fff"/>
          <circle cx="35.9" cy="50.6" r=".75" fill="#fff"/><circle cx="61.9" cy="50.6" r=".75" fill="#fff"/>
          <g stroke="#1a120d" stroke-width="1.4" fill="none" stroke-linecap="round">
            <path d="M31.2 46.5Q37 40.5 42.8 46.5M57.2 46.5Q63 40.5 68.8 46.5"/>
            <path d="M31.6 45.4l-2.2-1.6M32.6 44l-1.6-2M67.4 44l1.6-2M68.4 45.4l2.2-1.6"/>
          </g>
          <!-- rosy cheeks + freckles -->
          <ellipse cx="31.5" cy="59" rx="5.2" ry="3.3" fill="#ff7f8f" opacity=".42"/>
          <ellipse cx="68.5" cy="59" rx="5.2" ry="3.3" fill="#ff7f8f" opacity=".42"/>
          <g fill="#b9775c" opacity=".55"><circle cx="40" cy="56" r=".45"/><circle cx="42.5" cy="57.2" r=".45"/><circle cx="41" cy="58.6" r=".4"/><circle cx="60" cy="56" r=".45"/><circle cx="57.5" cy="57.2" r=".45"/><circle cx="59" cy="58.6" r=".4"/></g>
          <!-- button nose + nose ring -->
          <path d="M48 56.2Q50 58.4 52 56.2" stroke="#b8735a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <circle cx="47.6" cy="57.6" r="1.3" fill="none" stroke="#e2e5ea" stroke-width=".8"/>
          <!-- happy smile -->
          <path d="M43.5 63Q50 63.8 56.5 63Q55.5 69.5 50 69.5Q44.5 69.5 43.5 63Z" fill="#7a2f35"/>
          <path d="M46.3 67.6Q50 65.6 53.7 67.6Q52 69.5 50 69.5Q48 69.5 46.3 67.6Z" fill="#f08a8f"/>
          <path d="M44.2 63.2Q50 64.4 55.8 63.2L55.6 64.3Q50 65.3 44.4 64.3Z" fill="#fff"/>
          <!-- lip stud -->
          <circle cx="55.6" cy="71.6" r="1" fill="#8d9096"/><circle cx="55.3" cy="71.3" r=".32" fill="#fff"/>
          </g>
        </svg>
        <svg class="specs" viewBox="0 0 100 100" fill="none" stroke-linecap="round"><g transform="translate(50 52) scale(1.18) translate(-50 -52)">
          <g stroke="#0a0a0a" stroke-width="2.6">
            <circle cx="37" cy="48" r="8.6"/><circle cx="63" cy="48" r="8.6"/>
            <path d="M45.6 47Q50 44.6 54.4 47M28.4 46.5L21 44M71.6 46.5L79 44"/>
          </g>
          <g stroke="#39ff88" stroke-width=".9" opacity=".95">
            <circle cx="37" cy="48" r="8.6"/><circle cx="63" cy="48" r="8.6"/>
          </g>
          <rect x="47" y="43.3" width="6" height="5.5" rx="1" fill="#f4f1e6" stroke="#bbb" stroke-width=".5" transform="rotate(12 50 46)"/>
          <path d="M31.5 43.5Q33.5 41.5 36 41.2M57.5 43.5Q59.5 41.5 62 41.2" stroke="#fff" stroke-width="1.1" opacity=".55"/>
        </g></svg>
      </div>
    </div>
    <div class="name">SARAH</div>
    <div class="cls">TYPE: NERDY McNERDFACE</div>
    <div class="stats" id="stats"></div>
    <div class="ability"><b>SPECIAL ABILITY:</b><br>Sees any spreadsheet and immediately asks “but what if it was a web app?”</div>
    <div class="foot"><span>CARD #0001 OF 1</span><span id="serial"></span></div>
  </div>
  <p class="after" id="after"></p>
  <button class="again" id="again">↻ VERIFY AGAIN</button>
</section>

<script>
/* ---------- matrix rain ---------- */
const rain=document.getElementById('rain'),rc=rain.getContext('2d');
const glyphs='01アイウエオカキクケコサシスセソ<>{}[]=+*#$%&λΣπ∫∂';
let cols,drops,fs=16;
function sizeRain(){rain.width=innerWidth;rain.height=innerHeight;cols=Math.ceil(innerWidth/fs);drops=Array.from({length:cols},()=>Math.random()*-50)}
sizeRain();addEventListener('resize',sizeRain);
setInterval(()=>{
  rc.fillStyle='rgba(5,7,13,.12)';rc.fillRect(0,0,rain.width,rain.height);
  rc.font=fs+'px monospace';
  drops.forEach((y,i)=>{
    rc.fillStyle=Math.random()>.97?'#d9ffe9':'#39ff88';
    rc.fillText(glyphs[Math.random()*glyphs.length|0],i*fs,y*fs);
    drops[i]=y*fs>rain.height&&Math.random()>.975?0:y+1;
  });
},50);

/* ---------- typing terminal line ---------- */
const termText='> INITIATING NERD VERIFICATION PROTOCOL...';
let ti=0;const term=document.getElementById('term');
(function type(){if(ti<=termText.length){term.textContent=termText.slice(0,ti++);setTimeout(type,45)}})();

/* ---------- the buttons ---------- */
const yes=document.getElementById('yes'),no=document.getElementById('no'),taunt=document.getElementById('taunt');
const taunts=['Nope.','Too slow.','Access denied.','Error 404: "No" not found','Did you mean YES?','sudo no? Permission denied.',
  'Nice try.','The NO button has left the chat.','Ctrl+Z that thought.','Resistance is futile.','You can\'t catch me.',
  'Just press the big one.','It\'s literally right there.','I can do this all day.','Are you even trying?','YES is getting impatient.'];
let dodges=0,scale=1,lastMove=0;

function dodge(e){
  if(e){e.preventDefault();e.stopPropagation();}
  const now=Date.now();if(now-lastMove<120)return;lastMove=now;
  dodges++;
  // grow YES
  scale=Math.min(1+dodges*0.35, 12);
  yes.style.setProperty('--s',scale);
  if(dodges>=3)yes.classList.add('pulse');
  // move NO somewhere random, away from YES
  const r=no.getBoundingClientRect();
  if(!no.classList.contains('free')){no.style.left=r.left+'px';no.style.top=r.top+'px';no.classList.add('free');}
  const pad=12,w=r.width,h=r.height;
  const yr=yes.getBoundingClientRect();
  let x,y,tries=0;
  do{
    x=pad+Math.random()*(innerWidth-w-pad*2);
    y=pad+Math.random()*(innerHeight-h-pad*2);
    tries++;
  }while(tries<40 && (overlaps(x,y,w,h,yr) || Math.hypot(x-r.left,y-r.top)<120));
  no.style.left=x+'px';no.style.top=y+'px';
  taunt.textContent=taunts[(dodges-1)%taunts.length];
  if(navigator.vibrate)navigator.vibrate(15);
}
function overlaps(x,y,w,h,b){return !(x+w<b.left-20||x>b.right+20||y+h<b.top-20||y>b.bottom+20)}
['mouseenter','pointerdown','touchstart','click','focus'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));
// also flee when the cursor gets close
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const r=no.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(Math.hypot(e.clientX-cx,e.clientY-cy)<Math.max(r.width,r.height)*0.75)dodge();
});

/* ---------- YES! ---------- */
const stage=document.getElementById('stage'),reveal=document.getElementById('reveal'),card=document.getElementById('card');
const stats=[['Lifelong dream of studying maths. For fun.',100],['Eye-roll-worthy puns',99],['Mad spreadsheets',97],['Gets excited about puzzles',97],['Has a list of lists',92],['Can knit',89],['Touching grass',64]];
yes.addEventListener('click',()=>{
  stage.style.display='none';no.style.display='none';
  reveal.classList.add('on');
  document.getElementById('serial').textContent='NC-'+Math.random().toString(16).slice(2,8).toUpperCase();
  const s=document.getElementById('stats');
  s.innerHTML=stats.map(([n,v])=>`<div class="stat"><div class="l"><span>${n}</span><span>${v}</span></div><div class="bar${n==='Touching grass'?' grass':v<30?' low':''}"><i data-v="${v}"></i></div></div>`).join('');
  setTimeout(()=>s.querySelectorAll('i').forEach(i=>i.style.width=i.dataset.v+'%'),700);
  document.getElementById('after').innerHTML = dodges
    ? `It took you <b>${dodges} attempt${dodges>1?'s':''}</b> to finally say yes.`+(dodges>5?`<br>Good Lordt.`:'')
    : `Straight to YES. <b>Correct answer.</b>`;
  boom();
});
document.getElementById('again').addEventListener('click',()=>location.reload());

/* ---------- holo tilt ---------- */
function tilt(x,y){
  const r=card.getBoundingClientRect(),px=(x-r.left)/r.width,py=(y-r.top)/r.height;
  card.style.transform=`rotateY(${(px-.5)*24}deg) rotateX(${(.5-py)*24}deg)`;
  card.style.setProperty('--hx',px*100+'%');card.style.setProperty('--hy',py*100+'%');
}
card.addEventListener('pointermove',e=>tilt(e.clientX,e.clientY));
card.addEventListener('touchmove',e=>{const t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});
card.addEventListener('pointerleave',()=>card.style.transform='');
card.addEventListener('animationend',()=>card.style.animation='none');

/* ---------- confetti ---------- */
const cf=document.getElementById('confetti'),cc=cf.getContext('2d');let parts=[];
function boom(){
  cf.width=innerWidth;cf.height=innerHeight;
  const colors=['#39ff88','#22e4ff','#ff3df2','#ffe14d','#ffffff'];
  for(let i=0;i<220;i++)parts.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*18,vy:Math.random()*-18-4,
    s:Math.random()*8+4,c:colors[i%colors.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,t:Math.random()<.3?'01'[i%2]:null});
  requestAnimationFrame(tick);
}
function tick(){
  cc.clearRect(0,0,cf.width,cf.height);
  parts.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cc.save();cc.translate(p.x,p.y);cc.rotate(p.r);cc.fillStyle=p.c;
    if(p.t){cc.font='bold '+(p.s*2)+'px monospace';cc.fillText(p.t,0,0)}else cc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cc.restore();});
  parts=parts.filter(p=>p.y<cf.height+40);
  if(parts.length)requestAnimationFrame(tick);
}
</script>
